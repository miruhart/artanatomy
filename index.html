    :root {

      --brown: #6b6455;
      --white: #FFFFFF;
      --cream: #fbf6ed;
      --mustard: #ffe07c;
      --pink: #ffc7db;
      --green: #99e8bc;
      --blue: #bdccf5;
      --border-radius: 1.6rem;
      --border: 3px solid var(--line);
      --border-s: 2px solid var(--line);
      --box-shadow: 3px 3px 0 var(--line);
      --max-width: 600px;
    }

    * {

      margin: 0;
      padding: 0;
    }

    @media (prefers-reduced-motion: reduce) {
      * {

        animation-iteration-count: 1 !important;
        transition-duration: 0.001ms !important;
      }

      color: var(--line);

      padding: 1rem;
      width: 100%;
      max-width: var(--max-width);
      overflow: hidden;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .section {

      padding: 1.5rem 1rem;
      border: var(--border);

      background-color: var(--white);

      margin-top: 1rem;

    .section.center {

      font-size: 0.8rem;
      font-weight: 900;
      letter-spacing: 0.08em;
      box-shadow: var(--box-shadow);
      margin-bottom: 1.1rem;
    }

    h1 {

      font-weight: 900;
      line-height: 1.4;
      letter-spacing: 0.01em;
      margin-bottom: 1rem;
    }

    h2 {
      font-size: 1.5rem;
      font-weight: 900;
      line-height: 1.4;
      letter-spacing: 0.01em;
      margin-bottom: 0.4rem;
    }

    .lead {
      font-size: 1rem;
      line-height: 1.75;
      font-weight: 600;
      margin-bottom: 1rem;
      color: var(--line);
      letter-spacing: -0.01em;
    }

    .pop {
      opacity: 0;
      animation: pop-in 480ms cubic-bezier(.28, 1.35, .4, 1) forwards;
    }

    .slide {
      opacity: 0;
      animation: slide-in 340ms cubic-bezier(.28, 1.35, .4, 1) forwards;
    }

    @keyframes pop-in {
      from {
        opacity: 0;
        transform: translateY(14px) scale(.94);
      }

      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    @keyframes slide-in {
      from {
        opacity: 0;
        transform: translateX(28px);
      }

      to {
        opacity: 1;
        transform: translateX(0);
      }
    }

    .no-border {
      border: none;
      box-shadow: none;
      padding-right: 0;
      padding-left: 0;
    }

    /* ---- hero ---- */
    .hero {
      text-align: center;
      padding: 1rem 0 0;
    }

    .hero .logo {
      width: 5.5rem;
      margin-bottom: 1rem;
    }

    .hero .brandname {
      font-family: 'Archivo Black', sans-serif;
      font-size: 0.9rem;
      font-weight: 400;
      letter-spacing: 0.1em;
      margin-bottom: 0.6rem;
    }

    .hero h1 {
      font-size: 1.7rem;
      font-weight: 900;
      line-height: 1.45;
      letter-spacing: 0.01em;
    }

    .hero h1 .hl {
      background: linear-gradient(transparent 58%, var(--mustard) 58%);
    }

    .pilot-tag {
      display: inline-block;
      font-size: 0.68rem;
      font-weight: 700;
      color: var(--sub);
      border: 2px dashed var(--line);
      border-radius: 999px;
      padding: 0.4rem 0.8rem;
      margin-top: 0.4rem;
    }

    /* ---- stage cards ---- */
    .stage-active {
      background: var(--white);
    }

    .stage-locked {
      background: var(--cream);
    }

      color: var(--brown);

      background: var(--white);

      font-size: 0.78rem;
      font-weight: 900;
      cursor: pointer;
      font-family: 'Zen Kaku Gothic New';
      color: var(--line);
      box-shadow: var(--box-shadow);

    .back-btn:active {
      transform: translate(1px, 1px);
      box-shadow: 1px 1px 0 var(--line);
    }

    .crumb {
      font-size: 0.72rem;
      color: var(--sub);
      font-weight: 700;

      gap: 0.8rem;
      margin-top: 0.8rem;

      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.7rem;
      width: 100%;
      text-align: left;
      background: var(--mustard);
      border: var(--border-s);
      border-radius: 999px;
      padding: 1.1rem 1.3rem;
      font-weight: 700;
      font-size: 1rem;
      cursor: pointer;
      color: var(--line);
      text-decoration: none;
      font-family: 'Zen Kaku Gothic New';
      box-shadow: 3px 3px 0 var(--line);
      transition: transform 120ms ease, box-shadow 120ms ease;
    }

    .list-row:active {
      transform: translate(3px, 3px);
      box-shadow: 0 0 0 var(--line);
    }

    .list-row .arrow {
      font-weight: 900;
      color: var(--line);
      flex: none;
    }

    .list-row .row-title {
      line-height: 1.55;
    }

    /* ---- ep card ---- */
    .ep-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1rem;
      background: var(--mustard);
      border: var(--border);
      border-radius: 20px;
      padding: 1.2rem;

      margin-bottom: 1rem;

      background: var(--pink);

      transform: translate(2px, 2px);
      box-shadow: none;
    }

    .detail-article-card {

      border: var(--border);
      border-radius: 20px;
      padding: 1.4rem 1.2rem;
      box-shadow: var(--box-shadow);
      margin-bottom: 1.2rem;

      line-height: 1.75;
      font-weight: 600;
      color: var(--sub);
      margin-bottom: 1rem;
      letter-spacing: -0.01em;

    .footer {

      padding: 2rem 1rem;
      margin-top: auto;

      font-weight: 500;
      letter-spacing: 0.04em;
      color: var(--sub);

    .badge-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 0.7rem;
      margin-top: 1rem;

    .badge-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.4rem;
      background: var(--mustard);
      border: var(--border-s);
      border-radius: 20px;
      padding: 0.9rem 0.3rem 0.7rem;
      cursor: pointer;
      box-shadow: 3px 3px 0 var(--line);
      transition: transform 120ms ease, box-shadow 120ms ease;
      text-align: center;
    }

    .badge-item:active {
      transform: translate(2px, 2px);
      box-shadow: 1px 1px 0 var(--line);
    }

    .badge-icon {
      width: 2.7rem;
      height: 2.7rem;
      border-radius: 50%;
      border: 2px solid var(--line);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.1rem;
      flex: none;
    }

    .badge-label {
      font-size: 1rem;
      font-weight: 700;
      line-height: 1.2;
      letter-spacing: 0.08em;
    }

    /* ---- 感情タグチップ ---- */
    .tag-list {
      display: flex;
      flex-wrap: wrap;
      gap: 0.3rem;
      width: 100%;
      margin-top: 0.1rem;

    .tag-pill {
      font-size: 0.7rem;
      font-weight: 700;
      color: #555;
      background: var(--cream);
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 0.2rem 0.4rem;
      letter-spacing: -0.04em;
      line-height: 1.2;
      white-space: nowrap;
    }

    .tag-pill-lg {
      font-size: 0.9rem;
      font-weight: 700;
      color: var(--line);
      letter-spacing: 0.04em;
      background: var(--white);
      border: 2px solid var(--line);
      border-radius: 999px;
      padding: 0.5rem 0.75rem;
    }

    .item-icon-big {
      width: 4rem;
      height: 4rem;
      border-radius: 50%;
      border: var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.8rem;
      margin: 0 auto 0.8rem;
      box-shadow: var(--box-shadow);
    }

    .genre-label {
      font-size: 0.8rem;
      font-weight: 700;
      color: var(--line);
      margin-top: 1.5rem;
      margin-bottom: 0.4rem;
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }

    .word-grid {
      grid-template-columns: repeat(3, 1fr);
      gap: 0.6rem;
      margin-top: 0;
    }

    .word-badge {
      padding: 0.8rem 0.6rem;
      border-radius: 10rem;
      justify-content: center;
    }
  </style>
</head>

      if (state.view === "emotionList") renderEmotionList();
      else if (state.view === "categoryList") renderCategoryList();
      else if (state.view === "emotion") renderEmotion(state.emotion, state.word);
      else if (state.view === "category") renderCategory(state.cat, state.emotion);
      else if (state.view === "sub") renderSub(state.sub, state.cat, state.emotion);
      else renderHome();
    }

    function renderHome() {
      topbarEl.innerHTML = "";
      let html = `
    <section class="hero pop">
      <img class="logo" src="assets/logo-black.png" alt="miruha">
      <h1 class="display">美術解剖図鑑<br><span class="hl">逆引きインデックス</span></h1>
    </section>
  `;

      STAGES.forEach((stage, i) => {
        html += `<section class="section center pop ${stage.active ? "stage-active" : "stage-locked"}" style="animation-delay:${i * 60}ms">
      <div class="eyebrow">${stage.active ? `<i class=\"fa-solid fa-lock-open\"></i> STAGE ${stage.num}` : `<i class=\"fa-solid fa-lock\"></i> STAGE ${stage.num}`}</div>
      <h2>${stage.title}</h2>
      <p class="lead" style="font-size:0.9rem;">${stage.goal}</p>
      ${stage.active ? `
        <div class="badge-grid" id="cat-grid"></div>
        <p class="mode-hint" style="margin-top:1.3rem">うまく言葉にならないときは</p>
        <div class="list-col" id="wordrow-${stage.num}"></div>
      ` : ""}
    </section>`;
      });

      viewEl.innerHTML = html;

      const grid = document.getElementById("cat-grid");
      if (grid) {
        CATEGORIES.forEach(cat => {
          const item = document.createElement("div");
          item.className = "badge-item";
          item.dataset.cat = cat.key;
          item.innerHTML = `<span class="badge-icon" style="background:var(--white)"><i class="fa-solid fa-${cat.icon}"></i></span><span class="badge-label">${cat.name}</span>`;
          item.addEventListener("click", () => goto({ view: "category", cat: cat.key }));
          grid.appendChild(item);
        });
      }

      const row = document.getElementById("wordrow-1");
      if (row) {
        const item = document.createElement("div");
        item.className = "list-row";
        item.innerHTML = `<span class="badge-icon" style="background:var(--white)"><i class="fa-solid fa-heart"></i></span><span class="row-title">気持ち・感覚から探す</span><span class="arrow"><i class="fa-solid fa-arrow-right"></i></span>`;
        item.addEventListener("click", () => goto({ view: "emotionList" }));
        row.appendChild(item);
      }
    }

    function renderEmotionList() {
      topbarEl.innerHTML = `
    <button class="back-btn" id="backBtn"><i class="fa-solid fa-arrow-left"></i> TOPに戻る</button>
  `;
      document.getElementById("backBtn").addEventListener("click", () => history.back());

      const groups = EMOTIONS.map(em => {
        const badges = em.words.map(w => `<div class="badge-item word-badge" data-em="${em.key}" data-word="${w}"><span class="badge-label">${w}</span></div>`).join("");
        return `
      <div class="genre-label">
        <i class="fa-solid fa-${em.icon}"></i> ${em.name}</div>
      <div class="badge-grid word-grid">${badges}</div>
    `;
      }).join("");

      viewEl.innerHTML = `
    <section class="section slide" style="background:var(--white)">
      <div class="eyebrow"><i class="fa-solid fa-heart"></i> 気持ち・感覚</div>
      <h2>作品を前に、どう感じてる？</h2>
      <p class="lead">その気持ちや感覚は、どんな視覚のしかけにつながっているのかな？</p>
      ${groups}
    </section>
  `;

      viewEl.querySelectorAll("[data-em]").forEach(row => {
        row.addEventListener("click", () => goto({ view: "emotion", emotion: row.dataset.em, word: row.dataset.word }));
      });
    }

    function renderCategoryList() {
      topbarEl.innerHTML = `
      <button class="back-btn" id="backBtn"><i class="fa-solid fa-arrow-left"></i> 戻る</button>
      <span class="crumb">Stage1 / 視覚のしかけから</span>
    `;
      document.getElementById("backBtn").addEventListener("click", () => history.back());

      const rows = CATEGORIES.map(cat => `
      <div class="list-row" data-cat="${cat.key}">
        <span><i class="fa-solid fa-${cat.icon}"></i></span><span class="row-title" style="flex:1">${cat.name}</span><span class="arrow"><i class="fa-solid fa-arrow-right"></i></span>
      </div>
    `).join("");

      viewEl.innerHTML = `
      <section class="section no-border slide" style="background:var(--mustard)">
        <div class="eyebrow"><i class="fa-solid fa-palette"></i> 視覚のしかけから探す</div>
        <h2>気になる「しかけ」をえらんでください</h2>
        <p class="lead">色・光・筆致など、6つの切り口があります。</p>
        <div class="list-col">${rows}</div>
      </section>
    `;

      viewEl.querySelectorAll("[data-cat]").forEach(row => {
        row.addEventListener("click", () => goto({ view: "category", cat: row.dataset.cat }));
      });
    }

    // 感情・オノマトペからSUBS内のtagsを元に動的にサブ要素を抽出して表示
    function renderEmotion(emKey, word) {
      const em = EMOTIONS.find(e => e.key === emKey);
      const heading = word || em.short;
      const others = em.words.filter(w => w !== heading);

      // 個別オノマトペの説明文を取得（存在しなければ大カテゴリのmechanismにフォールバック）
      const wordDescription = (word && WORD_DESCRIPTIONS[word]) ? WORD_DESCRIPTIONS[word] : em.mechanism;

      // SUBSの各アイテム内の tags から、選択された word (#ドキドキ 等) を含むものをリアルタイムで自動抽出！
      let matchedSubs = word
        ? SUBS.filter(s => s.tags && s.tags.some(t => t.replace('#', '') === word))
        : SUBS.filter(s => em.subs.includes(s.key));

      // 万が一1つもマッチしなかった場合の安全回路
      if (matchedSubs.length === 0) {
        matchedSubs = SUBS.filter(s => em.subs.includes(s.key));
      }

      topbarEl.innerHTML = `
    <button class="back-btn" id="backBtn"><i class="fa-solid fa-arrow-left"></i> 気持ち・感覚に戻る</button>
  `;
      document.getElementById("backBtn").addEventListener("click", () => history.back());

      const subBadges = matchedSubs.map(s => {
        const cat = CATEGORIES.find(x => x.key === s.cat) || { icon: "star" };
        const inner = s.swatch
          ? `<span class="badge-icon" style="background:${s.swatch}"></span>`
          : `<span class="badge-icon" style="background:var(--white)"><i class="fa-solid fa-${s.icon || cat.icon}"></i></span>`;

        const tagsHtml = s.tags && s.tags.length ? `
      <div class="tag-list">
        ${s.tags.slice(0, 2).map(t => `<span class="tag-pill">${t}</span>`).join("")}
      </div>
    ` : "";

        return `<div class="badge-item" data-sub="${s.key}" data-cat="${s.cat}">
      ${inner}
      <span class="badge-label">${s.name}</span>
    </div>`;
      }).join("");

      viewEl.innerHTML = `
    <section class="section slide">
      <div class="eyebrow"><i class="fa-solid fa-${em.icon}"></i> ${em.name}</div>
      <h2>「${heading}」</h2>
      <p class="lead" style="margin-top:0.4rem;">${wordDescription}</p>
      <p class="mode-hint" style="margin-top:1.5rem; font-size:0.8rem; color:var(--line);"><i class="fa-solid fa-lightbulb"></i> こんな「しかけ」が関係しているかも</p>
      <div class="badge-grid">${subBadges}</div>
    </section>
  `;

      viewEl.querySelectorAll("[data-sub]").forEach(btn => {
        btn.addEventListener("click", () => goto({ view: "sub", sub: btn.dataset.sub, cat: btn.dataset.cat, emotion: emKey }));
      });
    }

    function renderCategory(catKey, emotionKey) {
      const cat = CATEGORIES.find(c => c.key === catKey);
      const subs = SUBS.filter(s => s.cat === catKey);
      const em = EMOTIONS.find(e => e.key === emotionKey);
      const gotCount = subs.filter(s => s.episodes && s.episodes.length).length;

      topbarEl.innerHTML = `
    <button class="back-btn" id="backBtn"><i class="fa-solid fa-arrow-left"></i> TOPに戻る</button>`;
      document.getElementById("backBtn").addEventListener("click", () => history.back());

      const badges = subs.map(s => {
        const inner = s.swatch
          ? `<span class="badge-icon" style="background:${s.swatch}"></span>`
          : `<span class="badge-icon" style="background:var(--white)"><i class="fa-solid fa-${s.icon || cat.icon}"></i></span>`;

        const tagsHtml = s.tags && s.tags.length ? `
      <div class="tag-list">
        ${s.tags.slice(0, 2).map(t => `<span class="tag-pill">${t}</span>`).join("")}
      </div>
    ` : "";

        return `<div class="badge-item" data-sub="${s.key}">
      ${inner}
      <span class="badge-label">${s.name}</span>
    </div>`;
      }).join("");

      viewEl.innerHTML = `
    <section class="section slide">
      <div class="eyebrow"><i class="fa-solid fa-${cat.icon}"></i> ${cat.name}</div>
      <h2>${cat.name}のしかけ</h2>
      <p class="lead">${cat.meaning}</p>
      <p class="mode-hint" style="margin-top:1.5rem; font-size:0.8rem; color:var(--line);"><i class="fa-solid fa-lightbulb"></i> 例えば、こんな「${cat.name}のしかけ」があるよ</p>
      <div class="badge-grid">${badges}</div>
    </section>
  `;

      viewEl.querySelectorAll("[data-sub]").forEach(item => {
        item.addEventListener("click", () => goto({ view: "sub", sub: item.dataset.sub, cat: catKey, emotion: emotionKey }));
      });
    }

    function renderSub(subKey, catKey, emotionKey) {
      const s = SUBS.find(x => x.key === subKey) || { name: subKey, meaning: "", episodes: [], tags: [] };
      const cat = CATEGORIES.find(c => c.key === (s.cat || catKey)) || { name: "", icon: "star" };

      topbarEl.innerHTML = `
    <button class="back-btn" id="backBtn"><i class="fa-solid fa-arrow-left"></i> ${cat.name}に戻る</button>`;
      document.getElementById("backBtn").addEventListener("click", () => history.back());

      const bigIcon = s.swatch
        ? `<span class="item-icon-big" style="background:${s.swatch}"></span>`
        : `<span class="item-icon-big" style="background:var(--pink)"><i class="fa-solid fa-${s.icon || cat.icon}"></i></span>`;

      const tagsDetailHtml = s.tags && s.tags.length ? `
    <div class="tag-list" style="margin-top:0.6rem; margin-bottom:3rem;">
      ${s.tags.map(t => `<span class="tag-pill tag-pill-lg">${t}</span>`).join("")}
    </div>
  ` : "";

      // 改行(\n\n)を美しい段落(<p>)に自動整形
      const formattedMeaning = s.meaning
        ? s.meaning.split(/\n\n+/).map(p => `<p>${p.replace(/\n/g, '<br>')}</p>`).join('')
        : `<p>${s.meaning}</p>`;

      const hasEps = s.episodes && s.episodes.length;
      const eps = hasEps ? s.episodes.map(ep => {
        const volBadge = ep.vol ? `<span class="eyebrow">${ep.vol}</span>` : '';
        const artistsHtml = ep.artists && ep.artists.length ? `
          <div class="tag-list">
            ${ep.artists.map(a => `<span class="tag-pill">${a}</span>`).join('')}
          </div>
        ` : '';

        return `
          <div class="ep-card">
            <div class="ep-card-top">
              ${volBadge}
              <div class="ep-card-title">${ep.title}</div>
            </div>
            ${artistsHtml}
            <a class="ep-link-btn" href="${ep.url || '#'}" target="_blank" rel="noopener">
              <span>Instagramで読む</span>
              <i class="fa-solid fa-up-right-from-square"></i>
            </a>
          </div>
        `;
      }).join("") : ``;

      viewEl.innerHTML = `
    <section class="section no-border slide" style="background:var(--cream);padding-bottom:0;">
      <div style="text-align:center;">
        ${bigIcon}
        <h1>${s.name}</h1>
        ${s.summary ? `<div class="lead">${s.summary}</div>` : ''}
        <div class="detail-article-card">
          <div class="detail-article-body">
            ${formattedMeaning}
          </div>
        </div>
        ${tagsDetailHtml}
      </div>
      ${hasEps ? `<div class="mode-hint" style="margin:1.5rem 0 0.5rem; text-align:left;">「${s.name}」をテーマにした漫画はこちら</div><div class="list-col">${eps}</div>` : eps}
    </section>
  `;
    }

    function renderLoading() {
      viewEl.innerHTML = `
    <section class="section center pop" style="background:var(--white); padding:3rem 1.5rem;">
      <p class="lead" style="text-align:center;">読み込み中…</p>
    </section>
  `;
    }

    function renderGate(kind) {
      topbarEl.innerHTML = "";
      const copy = {
        notline: {
          eyebrow: "OPEN IN LINE",
          title: "このページは<br>LINEの中だけで<br>見ることができます",
          body: "お手数ですが、<br>公式アカウントのトーク画面から<br>もう一度ひらいてください。",
          showBtn: false
        },
        notfriend: {
          eyebrow: "LINE ONLY",
          title: "このページは<br>miruha公式アカウントの<br>限定コンテンツです",
          body: "下のボタンから友だち追加して、<br>トーク画面のメニューから<br>もう一度ひらいてください。",
          showBtn: true
        },
        error: {
          eyebrow: "ERROR",
          title: "うまく読み込めません<br>でした",
          body: "少し時間をおいて、<br>もう一度開いてみてください。",
          showBtn: false
        }
      }[kind];

      viewEl.innerHTML = `
    <section class="hero pop">
      <img class="logo" src="assets/logo-black.png" alt="miruha">
      <h1 class="display">美術解剖図鑑<br><span class="hl">逆引きインデックス</span></h1>
    </section>
    <section class="section center pop" style="background:var(--mustard);">
      <div class="eyebrow" style="background:var(--green);">${copy.eyebrow}</div>
      <h2>${copy.title}<br><i class="fa-solid fa-lock"></i></h2>
      <p class="lead" style="margin-bottom:0;">${copy.body}</p>
      ${copy.showBtn ? `<a class="ep-link-btn" href="${OFFICIAL_ACCOUNT_URL}" target="_blank" rel="noopener"><i class="fa-solid fa-user-plus"></i> 友だち追加する</a>` : ""}
    </section>
  `;
    }

    async function bootWithLiff() {
      renderLoading();

      // LIFF IDが未設定の間はゲートをかけず、開発中の見た目確認をそのまま続けられるようにする
      if (!LIFF_ID || LIFF_ID === "YOUR_LIFF_ID_HERE") {
        console.warn("[miruha] LIFF_ID が未設定です。友だち限定ゲートはスキップされています。");
        history.replaceState({ view: "home" }, "");
        renderHome();
        return;
      }

      try {
        await liff.init({ liffId: LIFF_ID });

        if (!liff.isInClient()) {
          renderGate("notline");
          return;
        }

        if (!liff.isLoggedIn()) {
          liff.login();
          return; // login()はリダイレクトするので、ここで処理終了
        }

        const friendship = await liff.getFriendship();
        if (friendship.friendFlag) {
          history.replaceState({ view: "home" }, "");
          renderHome();
        } else {
          renderGate("notfriend");
        }
      } catch (e) {
        console.error("[miruha] LIFF init error:", e);
        renderGate("error");
      }
    }

    bootWithLiff();
  </script>
