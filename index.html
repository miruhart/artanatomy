<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>美術解剖図鑑 逆引きインデックス | miruha</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Zen+Kaku Gothic+New:wght@400;500;700;900&family=Archivo+Black&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    :root {
      --line: #1a1a1a;
      --sub: #2c2c2c;
      --white: #FFFFFF;
      --cream: #fbf6ed;
      --mustard: #ffe07c;
      --pink: #ffc7db;
      --green: #99e8bc;
      --blue: #bdccf5;
      --border-radius: 1.6rem;
      --border: 3px solid var(--line);
      --border-s: 2px solid var(--line);
      --box-shadow: 3px 3px 0 var(--line);
      --max-width: 600px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    @media (prefers-reduced-motion: reduce) {
      * {
        animation-duration: 0.001ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.001ms !important;
      }
    }

    body {
      font-family: 'Zen Kaku Gothic New', sans-serif;
      background: var(--cream);
      width: 100%;
      max-width: var(--max-width);
      margin: 0 auto;
      color: var(--line);
      -webkit-tap-highlight-color: transparent;
    }

    .page {
      position: relative;
      padding: 1rem;
      width: 100%;
      max-width: var(--max-width);
      overflow: hidden;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .section {
      position: relative;
      padding: 1.5rem 1rem;
      border: var(--border);
      border-radius: var(--border-radius);
      background-color: var(--white);
      text-align: left;
      margin-top: 1rem;
      box-shadow: var(--box-shadow);
    }

    .section.center {
      text-align: center;
    }

    .eyebrow {
      display: inline-block;
      background: var(--blue);
      border: var(--border);
      border-radius: 999px;
      padding: 0.6rem 1rem;
      font-family: 'Archivo Black', 'Zen Kaku Gothic New', sans-serif;
      font-size: 0.8rem;
      font-weight: 900;
      letter-spacing: 0.08em;
      box-shadow: var(--box-shadow);
      margin-bottom: 1.1rem;
    }

    h1 {
      font-size: 2.2rem;
      font-weight: 900;
      line-height: 1.4;
      letter-spacing: 0.01em;
      margin-bottom: 1rem;
    }

    h2 {
      font-size: 1.3rem;
      font-weight: 900;
      line-height: 1.4;
      letter-spacing: 0.01em;
      margin-bottom: 0.4rem;
    }

    .lead {
      font-size: 1rem;
      line-height: 1.75;
      font-weight: 600;
      margin-bottom: 1rem;
      color: var(--sub);
      letter-spacing: -0.01em;
    }

    .pop {
      opacity: 0;
      animation: pop-in 480ms cubic-bezier(.28, 1.35, .4, 1) forwards;
    }

    .slide {
      opacity: 0;
      animation: slide-in 340ms cubic-bezier(.28, 1.35, .4, 1) forwards;
    }

    @keyframes pop-in {
      from {
        opacity: 0;
        transform: translateY(14px) scale(.94);
      }

      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    @keyframes slide-in {
      from {
        opacity: 0;
        transform: translateX(28px);
      }

      to {
        opacity: 1;
        transform: translateX(0);
      }
    }

    .no-border {
      border: none;
      box-shadow: none;
      padding-right: 0;
      padding-left: 0;
    }

    /* ---- hero ---- */
    .hero {
      text-align: center;
      padding: 1rem 0 1rem;
    }

    .hero .logo {
      width: 5.5rem;
      margin-bottom: 1rem;
    }

    .hero .brandname {
      font-family: 'Archivo Black', sans-serif;
      font-size: 0.9rem;
      font-weight: 400;
      letter-spacing: 0.1em;
      margin-bottom: 0.6rem;
    }

    .hero h1 {
      font-size: 1.7rem;
      font-weight: 900;
      line-height: 1.45;
      letter-spacing: 0.01em;
    }

    .hero h1 .hl {
      background: linear-gradient(transparent 58%, var(--mustard) 58%);
    }

    .pilot-tag {
      display: inline-block;
      font-size: 0.68rem;
      font-weight: 700;
      color: var(--sub);
      border: 2px dashed var(--line);
      border-radius: 999px;
      padding: 0.4rem 0.8rem;
      margin-top: 0.4rem;
    }

    /* ---- stage cards ---- */
    .stage-active {
      background: var(--white);
    }

    .stage-locked {
      background: var(--cream);
    }

    .stage-locked h2 {
      color: #6b6455;
    }

    .stage-locked .lead {
      color: #8c8272;
    }

    .stage-locked .eyebrow {
      background-color: var(--cream);
    }

    .mode-hint {
      font-size: 0.9rem;
      color: var(--sub);
      font-weight: 700;
      margin-top: 0.9rem;
      margin-bottom: 0.2rem;
    }

    /* ---- topbar ---- */
    .topbar {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      padding: 1.2rem 0 0.6rem;
      flex-wrap: wrap;
    }

    .back-btn {
      display: inline-flex;
      align-items: center;
      gap: 0.3rem;
      border: var(--border-s);
      background: var(--white);
      border-radius: 999px;
      padding: 0.45rem 0.85rem;
      font-size: 0.78rem;
      font-weight: 900;
      cursor: pointer;
      font-family: 'Zen Kaku Gothic New';
      color: var(--line);
      box-shadow: var(--box-shadow);
    }

    .back-btn:active {
      transform: translate(1px, 1px);
      box-shadow: 1px 1px 0 var(--line);
    }

    .crumb {
      font-size: 0.72rem;
      color: var(--sub);
      font-weight: 700;
    }

    /* ---- list rows ---- */
    .list-col {
      display: flex;
      flex-direction: column;
      gap: 0.8rem;
      margin-top: 0.8rem;
    }

    .list-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.7rem;
      width: 100%;
      text-align: left;
      background: var(--mustard);
      border: var(--border-s);
      border-radius: 999px;
      padding: 1.1rem 1.3rem;
      font-weight: 700;
      font-size: 1rem;
      cursor: pointer;
      color: var(--line);
      text-decoration: none;
      font-family: 'Zen Kaku Gothic New';
      box-shadow: 3px 3px 0 var(--line);
      transition: transform 120ms ease, box-shadow 120ms ease;
    }

    .list-row:active {
      transform: translate(3px, 3px);
      box-shadow: 0 0 0 var(--line);
    }

    .list-row .arrow {
      font-weight: 900;
      color: var(--line);
      flex: none;
    }

    .list-row .row-title {
      line-height: 1.55;
    }

    /* ---- ep card ---- */
    .ep-card {
      background: var(--mustard);
      border: var(--border);
      border-radius: 20px;
      padding: 1.2rem;
      box-shadow: var(--box-shadow);
      margin-bottom: 1rem;
      text-align: left;
    }

    .ep-card-img {
      display: flex;
      justify-self: center;
    }

    .ep-card-img img {
      width: 16rem;
      height: 16rem;
      object-fit: cover;
      border-radius: 10rem;
      border: 3px solid var(--sub);
    }

    .ep-card-title {
      font-size: 1.2rem;
      font-weight: 800;
      line-height: 1.6;
      margin-bottom: 1rem;
      color: var(--line);
    }

    .ep-card-summary {
      font-size: 0.8rem;
      line-height: 1.65;
      color: var(--sub);
      background: var(--white);
      padding: 0.85rem;
      border-radius: 12px;
      margin-bottom: 0.85rem;
      border: 1.5px solid #e0d8c8;
    }

    .ep-card-works {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      margin-bottom: 1.5rem;
    }

    .ep-work-tag {
      font-size: 0.9rem;
      font-weight: 700;
      color: var(--sub);
      background: var(--white);
      border-radius: var(--border-radius);
      padding: 0.8rem 1rem;
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
    }

    .ep-link-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      width: 100%;
      background: var(--line);
      color: var(--white);
      text-decoration: none;
      padding: 0.75rem;
      border-radius: 999px;
      font-weight: 700;
      letter-spacing: 0.08em;
      font-size: 1rem;
      box-shadow: 2px 2px 0 var(--sub);
      transition: transform 120ms ease;
    }

    .ep-link-btn:active {
      transform: translate(2px, 2px);
      box-shadow: none;
    }

    /* ---- 詳細ページの長文解説スタイル ---- */
    .detail-article-card {
      background: var(--white);
      border: var(--border);
      border-radius: 20px;
      padding: 1.4rem 1.2rem;
      box-shadow: var(--box-shadow);
      margin-bottom: 1.2rem;
      text-align: left;
    }

    .detail-article-body p {
      font-size: 0.94rem;
      line-height: 1.85;
      font-weight: 600;
      color: var(--sub);
      margin-bottom: 1rem;
      letter-spacing: -0.01em;
    }

    .detail-article-body p:last-child {
      margin-bottom: 0;
    }

    /* ---- footer ---- */
    .footer {
      text-align: center;
      padding: 1.5rem 1rem 2.5rem;
      margin-top: auto;
    }

    .footer .logo {
      width: 4.5rem;
    }

    .footer p {
      font-size: 0.72rem;
      font-weight: 500;
      letter-spacing: 0.04em;
      color: var(--sub);
    }

    /* ---- collection grid ---- */
    .badge-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 0.7rem;
      margin-top: 1rem;
    }

    .badge-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.4rem;
      background: var(--mustard);
      border: var(--border-s);
      border-radius: 20px;
      padding: 0.9rem 0.3rem 0.7rem;
      cursor: pointer;
      box-shadow: 3px 3px 0 var(--line);
      transition: transform 120ms ease, box-shadow 120ms ease;
      text-align: center;
    }

    .badge-item:active {
      transform: translate(2px, 2px);
      box-shadow: 1px 1px 0 var(--line);
    }

    .badge-icon {
      width: 2.7rem;
      height: 2.7rem;
      border-radius: 50%;
      border: 2px solid var(--line);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.1rem;
      flex: none;
    }

    .badge-label {
      font-size: 1rem;
      font-weight: 700;
      line-height: 1.2;
      letter-spacing: 0.08em;
    }

    /* ---- 感情タグチップ ---- */
    .tag-list {
      display: flex;
      flex-wrap: wrap;
      gap: 0.25rem;
      justify-content: center;
      width: 100%;
      margin-top: 0.1rem;
    }

    .tag-pill {
      font-size: 0.6rem;
      font-weight: 700;
      color: #555;
      background: var(--cream);
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 0.1rem 0.4rem;
      line-height: 1.2;
      white-space: nowrap;
    }

    .tag-pill-lg {
      font-size: 0.8rem;
      font-weight: 800;
      color: var(--line);
      letter-spacing: -0.01em;
      background: var(--white);
      border: 2px solid var(--line);
      border-radius: 999px;
      padding: 0.5rem 0.75rem;
    }

    .item-icon-big {
      width: 4rem;
      height: 4rem;
      border-radius: 50%;
      border: var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.8rem;
      margin: 0 auto 0.8rem;
      box-shadow: var(--box-shadow);
    }

    .genre-label {
      font-size: 0.8rem;
      font-weight: 800;
      color: var(--line);
      margin-top: 1.2rem;
      margin-bottom: 0.4rem;
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }

    .word-grid {
      grid-template-columns: repeat(3, 1fr);
      gap: 0.55rem;
      margin-top: 0;
    }

    .word-badge {
      padding: 0.8rem 0.6rem;
      border-radius: 10rem;
      justify-content: center;
    }

    .word-badge .badge-label {
      font-size: 0.9rem;
    }
  </style>
</head>

<body>

  <div class="page">

    <footer class="footer">
      <img class="logo" src="assets/logo-black.png" alt="miruha">

  <script>
    const IG_ICON = `<svg class="ig" style="fill:#fff; width:1.1em;" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 448 512"><path d="M224.3 141a115 115 0 1 0 -.6 230 115 115 0 1 0 .6-230zm-.6 40.4a74.6 74.6 0 1 1 .6 149.2 74.6 74.6 0 1 1 -.6-149.2zm93.4-45.1a26.8 26.8 0 1 1 53.6 0 26.8 26.8 0 1 1 -53.6 0zm129.7 27.2c-1.7-35.9-9.9-67.7-36.2-93.9-26.2-26.2-58-34.4-93.9-36.2-37-2.1-147.9-2.1-184.9 0-35.8 1.7-67.6 9.9-93.9 36.1s-34.4 58-36.2 93.9c-2.1 37-2.1 147.9 0 184.9 1.7 35.9 9.9 67.7 36.2 93.9s58 34.4 93.9 36.2c37 2.1 147.9 2.1 184.9 0 35.9-1.7 67.7-9.9 93.9-36.2 26.2-26.2 34.4-58 36.2-93.9 2.1-37 2.1-147.8 0-184.8zM399 388c-7.8 19.6-22.9 34.7-42.6 42.6-29.5 11.7-99.5 9-132.1 9s-102.7 2.6-132.1-9c-19.6-7.8-34.7-22.9-42.6-42.6-11.7-29.5-9-99.5-9-132.1s-2.6-102.7 9-132.1c7.8-19.6 22.9-34.7 42.6-42.6 29.5-11.7 99.5-9 132.1-9s102.7-2.6 132.1 9c19.6 7.8 34.7 22.9 42.6 42.6 11.7 29.5 9 99.5 9 132.1s2.7 102.7-9 132.1z"/></svg>`;

    const STAGES = [

      { num: 2, title: "「絵を読む」探偵になる", goal: "モチーフの裏にあるメッセージが見抜ける", active: false },

    const CATEGORIES = [

    // 全49項目のサブ要素データ（詳細解説文を約2倍〜2.5倍の豊かで深い長文へアップデート）

        "episodes": [

        "meaning": "ルネサンス・バロック期に確立された「キアロスクーロ（明暗対比）」と呼ばれる技法で、画面の大部分を塗り潰す漆黒の闇と、そこへ切り込む激しい強光の対話です。\n\n光だけでは生まれない圧倒的な立体感とドラマ性が、深い漆黒の闇が存在することによって何倍にも引き立てられます。\n\n暗闇から突如として浮き上がる神聖な人体の質感は、観る者の皮膚感覚を刺戟し、ゾクゾクと肌が逆立つような劇的なカタルシスを提供してくれます。",
        "episodes": []
      }
    ];

    // 各オノマトペ・感情ワードごとの個別解説データ
    const WORD_DESCRIPTIONS = {
      // 没入・安心
      "うっとり": "画面全体に広がる美しい色や、やわらかな光のぼかしを見つめているうちに、時間や現実を忘れて心が心地よく満たされていく感覚。",
      "ほっこり": "温かみのある色合いや、人の優しさが伝わる手のポーズなどを見て、胸の奥がじんわりと温かくなるような安心感。",
      "吸い込まれそう": "一点透視図法による強い奥行きや、どこまでも深い青や金色の空間に、自分の身体ごと引っ張られていくような感覚。",
      "心が洗われる": "雲の隙間から射す光の柱や、一切の無駄を省いた白の世界を前にして、頭の中の雑念がスーッと消えて澄み渡る感覚。",
      "ホッとする": "安定感のある三角形の構図や、静かな光に包まれた光景を見て、身体の緊張がふっとほぐれる感覚。",
      "力がぬける": "輪郭線のないなめらかな陰影や、かすれた質感の筆跡を見つめることで、肩の力がすーっと抜けていくリラックス感。",

      // 畏敬・圧倒
      "ぞわぞわ": "生々しく盛り上がった絵の具の質感や、ねじれた身体の描写を見て、皮膚の表面がザラザラと逆立つような触覚的な反応。",
      "ゾクゾク": "圧倒的なスケールの奥行きや、暗闇から照らし出される強い光と影に息を呑み、ゾクッとするような鳥肌が立つ感覚。",
      "息を呑む": "細部まで完璧に描き込まれた細密画や、一瞬の静寂を捉えた絵を前にして、思わず息を止めて見入ってしまう感覚。",
      "鳥肌が立つ": "激しい絵の具の飛沫や、圧倒的なコントラストの劇的な光景に触れて、全身の細胞がゾクッと粟立つ感覚。",
      "圧倒される": "画面いっぱいに描かれた大勢の人々の熱気や、金箔が放つ眩い光に圧せられ、言葉を失ってしまう感覚。",
      "めまいがする": "多視点の歪んだ空間や、幾度も繰り返されるパターンを見続けることで、空間の平衡感覚がぐらりと揺らぐ感覚。",

      // 興奮・活力
      "ドキドキ": "強烈な赤や激しい対角線の動き、夜の暗闇に浮かぶ光を見て、本能的に心拍数が跳ね上がるような緊張と高揚感。",
      "ワクワク": "明るい黄色やオレンジ、躍動感のある飛び散る線を見て、これから何かが始まるような期待感で心が躍る感覚。",
      "ハッとする": "漆黒の中に差し込むスポットライトや鮮烈な色彩の対比に、一瞬で視線を奪われ意識が覚醒する感覚。",
      "血が騒ぐ": "画家の全身運動が残る激しい筆跡や、押し寄せる群衆のエネルギーに当てられて、身体の奥から熱い感情が湧き上がる感覚。",
      "テンションが上がる": "ポスターのように強いコントラストやポップな色彩の組み合わせを見て、脳がダイレクトに刺激される感覚。",
      "そわそわする": "不穏な雲が広がる空や、あえて傾けられた対角線の構図によって、心が落ち着かず胸がざわつく感覚。",

      // 違和感・不安
      "ざわざわ": "不気味な緑の影や、背中を向けた人物の沈黙から、言葉にできない不穏な気配や予感を感じ取って落ち着かなくなる感覚。",
      "ヒヤッとする": "すべてを呑み込む黒や、美しさと悲劇が隣り合わせの画面を見て、背筋に冷たい風が走るような恐怖感。",
      "もやもや": "視点が定まらない空間や、かすれた色調の重なりに触れて、頭の中で答えが出ず思考が漂う感覚。",
      "ソワソワ": "画面全体を埋め尽くす幾何学模様の反復や、荒れた空の気配に引っ張られ、胸の奥が落ち着かない感覚。",
      "落ち着かない": "画面上の物が歪んでいたり、ビビッドな原色がせめぎ合っていることで、視線の置き場に困りソワソワする感覚。",
      "こわいのに見たい": "恐ろしい事件や崩壊した廃墟の中に潜む、息を呑むほどの美しさに引き寄せられ、目が離せなくなる感覚。",

      // 知的快感
      "スッキリ": "幾何学的に計算されたまっすぐな線や、吸い込まれるような一点透視の空間を見て、乱れた心が整う感覚。",
      "なるほど！": "視線を誘導する構図の計算や、画面に散りばめられた画家のトリックに気づき、頭の中のパズルが解ける快感。",
      "アハ体験": "歪んだ視点や人物の視線の先に隠された意味を発見した瞬間、世界がガラリと違って見えてくる閃き。",
      "頭がさえる": "完璧なシンメトリーや整然と並ぶ四角形を見て、思考のノイズが消えて頭の中がクリアになる感覚。",
      "つながった感じ": "描かれた手と手のポーズや交錯する視線を通して、人と人、あるいは画面と自分との間に深い絆を感じる感覚。"
    };

    const EMOTIONS = [
      {
        key: "calm", name: "没入・安心", sub: "やすらぎ", icon: "leaf", bg: "var(--green)", short: "うっとり",
        words: ["うっとり", "ほっこり", "吸い込まれそう", "心が洗われる", "ホッとする", "力がぬける"],
        mechanism: "光やバランスのとれた構図を見ると、体の力がふっとぬけて、心がゆるんでいく。",
        subs: ["white", "blue", "sacredlight", "moonlight", "hands", "grid"]
      },
      {
        key: "awe", name: "畏敬・圧倒", sub: "とてつもない美しさ", icon: "mountain", bg: "var(--blue)", short: "ゾクゾク",
        words: ["ぞわぞわ", "ゾクゾク", "息を呑む", "鳥肌が立つ", "圧倒される", "めまいがする"],
        mechanism: "自分の力じゃとてもかなわないくらい大きいもの、細かいもの、神々しいものに出会うと、ちょっと怖いけど感動して鳥肌が立つ。",
        subs: ["backlight", "depth", "ruins", "hyperdetail", "stillmotion", "chiaroscuro"]
      },
      {
        key: "excite", name: "興奮・活力", sub: "エネルギー", icon: "fire", bg: "var(--mustard)", short: "ドキドキ",
        words: ["ドキドキ", "ワクワク", "ハッとする", "血が騒ぐ", "テンションが上がる", "そわそわする"],
        mechanism: "はっきりした色や、いきおいのある筆づかいを見ると、体がびっくりして気分が盛り上がる。",
        subs: ["red", "orange", "yellow", "splatter", "crowd", "diagonal"]
      },
      {
        key: "unease", name: "違和感・不安", sub: "不気味", icon: "eye", bg: "var(--pink)", short: "ざわざわ",
        words: ["ざわざわ", "ヒヤッとする", "もやもや", "ソワソワ", "落ち着かない", "こわいのに見たい"],
        mechanism: "現実ではありえない形や、暗い雰囲気を感じると、頭が「あれ、おかしいぞ」と混乱して落ち着かなくなる。",
        subs: ["greenc", "black", "multiperspective", "silence", "turnedaway", "entangled"]
      },
      {
        key: "insight", name: "知的快感", sub: "謎解き", icon: "magnifying-glass", bg: "var(--white)", short: "スッキリ",
        words: ["スッキリ", "なるほど！", "アハ体験", "頭がさえる", "つながった感じ"],
        mechanism: "絵の中に隠された意味や、画家が仕組んだトリックに気づくと、なぞが解けたみたいにスッキリする。",
        subs: ["vanishing", "poster", "symmetry", "gazeline", "lifedeath", "pointillism"]
      },
    ];

    const topbarEl = document.getElementById("topbar");
    const viewEl = document.getElementById("view");

    function goto(state) {
      history.pushState(state, "");
      render(state);
      window.scrollTo(0, 0);
    }
    window.addEventListener("popstate", (e) => {
      render(e.state || { view: "home" });
    });

    function render(state) {
      if (state.view === "emotionList") renderEmotionList();
      else if (state.view === "categoryList") renderCategoryList();
      else if (state.view === "emotion") renderEmotion(state.emotion, state.word);
      else if (state.view === "category") renderCategory(state.cat, state.emotion);
      else if (state.view === "sub") renderSub(state.sub, state.cat, state.emotion);
      else renderHome();
    }

    function renderHome() {
      topbarEl.innerHTML = "";
      let html = `
    <section class="hero pop">
      <img class="logo" src="assets/logo-black.png" alt="miruha">
      <h1 class="display">美術解剖図鑑<br><span class="hl">逆引きインデックス</span></h1>
    </section>
  `;

      STAGES.forEach((stage, i) => {
        html += `<section class="section center pop ${stage.active ? "stage-active" : "stage-locked"}" style="animation-delay:${i * 60}ms">
      <div class="eyebrow">${stage.active ? `<i class=\"fa-solid fa-lock-open\"></i> STAGE ${stage.num}` : `<i class=\"fa-solid fa-lock\"></i> STAGE ${stage.num}`}</div>
      <h2>${stage.title}</h2>
      <p class="lead" style="font-size:0.9rem;">${stage.goal}</p>
      ${stage.active ? `
        <div class="badge-grid" id="cat-grid"></div>
        <p class="mode-hint" style="margin-top:1.3rem">うまく言葉にならないときは</p>
        <div class="list-col" id="wordrow-${stage.num}"></div>
      ` : ""}
    </section>`;
      });

      viewEl.innerHTML = html;

      const grid = document.getElementById("cat-grid");
      if (grid) {
        CATEGORIES.forEach(cat => {
          const item = document.createElement("div");
          item.className = "badge-item";
          item.dataset.cat = cat.key;
          item.innerHTML = `<span class="badge-icon" style="background:var(--white)"><i class="fa-solid fa-${cat.icon}"></i></span><span class="badge-label">${cat.name}</span>`;
          item.addEventListener("click", () => goto({ view: "category", cat: cat.key }));
          grid.appendChild(item);
        });
      }

      const row = document.getElementById("wordrow-1");
      if (row) {
        const item = document.createElement("div");
        item.className = "list-row";
        item.innerHTML = `<span><i class="fa-solid fa-heart"></i></span><span class="row-title" style="flex:1">気持ち・感覚から探す</span><span class="arrow"><i class="fa-solid fa-arrow-right"></i></span>`;
        item.addEventListener("click", () => goto({ view: "emotionList" }));
        row.appendChild(item);
      }
    }

    function renderEmotionList() {
      topbarEl.innerHTML = `
    <button class="back-btn" id="backBtn"><i class="fa-solid fa-arrow-left"></i> TOPに戻る</button>
  `;
      document.getElementById("backBtn").addEventListener("click", () => history.back());

      const groups = EMOTIONS.map(em => {
        const badges = em.words.map(w => `<div class="badge-item word-badge" data-em="${em.key}" data-word="${w}"><span class="badge-label">${w}</span></div>`).join("");
        return `
      <div class="genre-label"><i class="fa-solid fa-${em.icon}"></i> ${em.name}</div>
      <div class="badge-grid word-grid">${badges}</div>
    `;
      }).join("");

      viewEl.innerHTML = `
    <section class="section slide" style="background:var(--white)">
      <div class="eyebrow"><i class="fa-solid fa-heart"></i> 気持ち・感覚</div>
      <h2>作品を前に、どう感じてる？</h2>
      <p class="lead">その気持ちや感覚は、どんな視覚のしかけにつながっているのかな？</p>
      ${groups}
    </section>
  `;

      viewEl.querySelectorAll("[data-em]").forEach(row => {
        row.addEventListener("click", () => goto({ view: "emotion", emotion: row.dataset.em, word: row.dataset.word }));
      });
    }

    function renderCategoryList() {
      topbarEl.innerHTML = `
      <button class="back-btn" id="backBtn"><i class="fa-solid fa-arrow-left"></i> 戻る</button>
      <span class="crumb">Stage1 / 視覚のしかけから</span>
    `;
      document.getElementById("backBtn").addEventListener("click", () => history.back());

      const rows = CATEGORIES.map(cat => `
      <div class="list-row" data-cat="${cat.key}">
        <span><i class="fa-solid fa-${cat.icon}"></i></span><span class="row-title" style="flex:1">${cat.name}</span><span class="arrow"><i class="fa-solid fa-arrow-right"></i></span>
      </div>
    `).join("");

      viewEl.innerHTML = `
      <section class="section no-border slide" style="background:var(--mustard)">
        <div class="eyebrow"><i class="fa-solid fa-palette"></i> 視覚のしかけから探す</div>
        <h2>気になる「しかけ」をえらんでください</h2>
        <p class="lead">色・光・筆致など、6つの切り口があります。</p>
        <div class="list-col">${rows}</div>
      </section>
    `;

      viewEl.querySelectorAll("[data-cat]").forEach(row => {
        row.addEventListener("click", () => goto({ view: "category", cat: row.dataset.cat }));
      });
    }

    // 感情・オノマトペからSUBS内のtagsを元に動的にサブ要素を抽出して表示
    function renderEmotion(emKey, word) {
      const em = EMOTIONS.find(e => e.key === emKey);
      const heading = word || em.short;
      const others = em.words.filter(w => w !== heading);

      // 個別オノマトペの説明文を取得（存在しなければ大カテゴリのmechanismにフォールバック）
      const wordDescription = (word && WORD_DESCRIPTIONS[word]) ? WORD_DESCRIPTIONS[word] : em.mechanism;

      // SUBSの各アイテム内の tags から、選択された word (#ドキドキ 等) を含むものをリアルタイムで自動抽出！
      let matchedSubs = word
        ? SUBS.filter(s => s.tags && s.tags.some(t => t.replace('#', '') === word))
        : SUBS.filter(s => em.subs.includes(s.key));

      // 万が一1つもマッチしなかった場合の安全回路
      if (matchedSubs.length === 0) {
        matchedSubs = SUBS.filter(s => em.subs.includes(s.key));
      }

      topbarEl.innerHTML = `
    <button class="back-btn" id="backBtn"><i class="fa-solid fa-arrow-left"></i> 気持ち・感覚に戻る</button>
  `;
      document.getElementById("backBtn").addEventListener("click", () => history.back());

      const subBadges = matchedSubs.map(s => {
        const cat = CATEGORIES.find(x => x.key === s.cat) || { icon: "star" };
        const inner = s.swatch
          ? `<span class="badge-icon" style="background:${s.swatch}"></span>`
          : `<span class="badge-icon" style="background:var(--white)"><i class="fa-solid fa-${cat.icon}"></i></span>`;

        const tagsHtml = s.tags && s.tags.length ? `
      <div class="tag-list">
        ${s.tags.slice(0, 2).map(t => `<span class="tag-pill">${t}</span>`).join("")}
      </div>
    ` : "";

        return `<div class="badge-item" data-sub="${s.key}" data-cat="${s.cat}">
      ${inner}
      <span class="badge-label">${s.name}</span>
    </div>`;
      }).join("");

      viewEl.innerHTML = `
    <section class="section slide">
      <div class="eyebrow"><i class="fa-solid fa-${em.icon}"></i> ${em.name}</div>
      <h2>「${heading}」</h2>
      <p class="lead" style="margin-top:0.4rem;">${wordDescription}</p>
      <p class="mode-hint" style="margin-top:1.1rem; font-size:0.82rem; color:var(--line);">こんな「しかけ」が関係しているかも</p>
      <div class="badge-grid">${subBadges}</div>
    </section>
  `;

      viewEl.querySelectorAll("[data-sub]").forEach(btn => {
        btn.addEventListener("click", () => goto({ view: "sub", sub: btn.dataset.sub, cat: btn.dataset.cat, emotion: emKey }));
      });
    }

    function renderCategory(catKey, emotionKey) {
      const cat = CATEGORIES.find(c => c.key === catKey);
      const subs = SUBS.filter(s => s.cat === catKey);
      const em = EMOTIONS.find(e => e.key === emotionKey);
      const gotCount = subs.filter(s => s.episodes && s.episodes.length).length;

      topbarEl.innerHTML = `
    <button class="back-btn" id="backBtn"><i class="fa-solid fa-arrow-left"></i> TOPに戻る</button>`;
      document.getElementById("backBtn").addEventListener("click", () => history.back());

      const badges = subs.map(s => {
        const inner = s.swatch
          ? `<span class="badge-icon" style="background:${s.swatch}"></span>`
          : `<span class="badge-icon" style="background:var(--white)"><i class="fa-solid fa-${cat.icon}"></i></span>`;

        const tagsHtml = s.tags && s.tags.length ? `
      <div class="tag-list">
        ${s.tags.slice(0, 2).map(t => `<span class="tag-pill">${t}</span>`).join("")}
      </div>
    ` : "";

        return `<div class="badge-item" data-sub="${s.key}">
      ${inner}
      <span class="badge-label">${s.name}</span>
    </div>`;
      }).join("");

      viewEl.innerHTML = `
    <section class="section slide">
      <div class="eyebrow"><i class="fa-solid fa-${cat.icon}"></i> ${cat.name}</div>
      <h2>${cat.name}のしかけ</h2>
      <p class="lead">${cat.meaning}</p>
      <div class="badge-grid">${badges}</div>
    </section>
  `;

      viewEl.querySelectorAll("[data-sub]").forEach(item => {
        item.addEventListener("click", () => goto({ view: "sub", sub: item.dataset.sub, cat: catKey, emotion: emotionKey }));
      });
    }

    function renderSub(subKey, catKey, emotionKey) {
      const s = SUBS.find(x => x.key === subKey) || { name: subKey, meaning: "", episodes: [], tags: [] };
      const cat = CATEGORIES.find(c => c.key === (s.cat || catKey)) || { name: "", icon: "star" };

      topbarEl.innerHTML = `
    <button class="back-btn" id="backBtn"><i class="fa-solid fa-arrow-left"></i> ${cat.name}に戻る</button>`;
      document.getElementById("backBtn").addEventListener("click", () => history.back());

      const bigIcon = s.swatch
        ? `<span class="item-icon-big" style="background:${s.swatch}"></span>`
        : `<span class="item-icon-big" style="background:var(--mustard)"><i class="fa-solid fa-${cat.icon}"></i></span>`;

      const tagsDetailHtml = s.tags && s.tags.length ? `
    <div class="tag-list" style="margin-top:0.6rem; margin-bottom:1.5rem; gap:0.5rem;">
      ${s.tags.map(t => `<span class="tag-pill tag-pill-lg">${t}</span>`).join("")}
    </div>
  ` : "";

      // 改行(\n\n)を美しい段落(<p>)に自動整形
      const formattedMeaning = s.meaning
        ? s.meaning.split(/\n\n+/).map(p => `<p>${p.replace(/\n/g, '<br>')}</p>`).join('')
        : `<p>${s.meaning}</p>`;

      const hasEps = s.episodes && s.episodes.length;
      const eps = hasEps ? s.episodes.map(ep => `
    <div class="ep-card">
      <div class="ep-card-title">${ep.title}</div>
      <div class="ep-card-img"><img src="assets/thumbnail/${s.key}.png"></div>
      ${ep.works && ep.works.length ? `
        <div class="mode-hint" style="margin-bottom:0.6rem;"">登場作品</div>
      <div class="ep-card-works">
          ${ep.works.map(w => `<span class="ep-work-tag">${w}</span>`).join("")}
        </div>
      ` : ""}
      <a class="ep-link-btn" href="${ep.url || '#'}" target="_blank" rel="noopener">
        ${IG_ICON} Instagramで読む
      </a>
    </div>
  `).join("") : ``;

      viewEl.innerHTML = `
    <section class="section no-border slide" style="background:var(--cream);">
      <div style="text-align:center;">
        ${bigIcon}
        <h1>${s.name}</h1>
        ${tagsDetailHtml}
        <div class="detail-article-card">
          <div class="detail-article-body">
            ${formattedMeaning}
          </div>
        </div>
      </div>
      ${hasEps ? `<div class="mode-hint" style="margin-bottom:0.6rem; text-align:left;">「${s.name}」がテーマの話はこちら</div><div class="list-col">${eps}</div>` : eps}
    </section>
  `;
    }

    history.replaceState({ view: "home" }, "");
    renderHome();
  </script>

</body>

</html>
