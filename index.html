  <style>
    :root {
      --line: #1a1a1a;
      --sub: #2c2c2c;
      --brown: #6b6455;
      --white: #FFFFFF;
      --cream: #fbf6ed;
      --mustard: #ffe07c;
      --pink: #ffc7db;
      --green: #99e8bc;
      --blue: #bdccf5;
      --border-radius: 1.6rem;
      --border: 3px solid var(--line);
      --border-s: 2px solid var(--line);
      --box-shadow: 3px 3px 0 var(--line);
      --max-width: 600px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    @media (prefers-reduced-motion: reduce) {
      * {
        animation-duration: 0.001ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.001ms !important;
      }
    }

    body {
      font-family: 'Zen Kaku Gothic New', sans-serif;
      background: var(--cream);
      width: 100%;
      max-width: var(--max-width);
      margin: 0 auto;
      color: var(--line);
      -webkit-tap-highlight-color: transparent;
    }

    .page {
      position: relative;
      padding: 1rem;
      width: 100%;
      max-width: var(--max-width);
      overflow: hidden;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .section {
      position: relative;
      padding: 1.5rem 1rem;
      border: var(--border);
      border-radius: var(--border-radius);
      background-color: var(--white);
      text-align: left;
      margin-top: 1rem;
      box-shadow: var(--box-shadow);
    }

    .section.center {
      text-align: center;
    }

    .eyebrow {
      display: inline-block;
      background: var(--blue);
      border: var(--border);
      border-radius: 999px;
      padding: 0.6rem 1rem;
      font-family: 'Archivo Black', 'Zen Kaku Gothic New', sans-serif;
      font-size: 0.8rem;
      font-weight: 900;
      letter-spacing: 0.08em;
      box-shadow: var(--box-shadow);
      margin-bottom: 1.1rem;
    }

    h1 {
      font-size: 2.2rem;
      font-weight: 900;
      line-height: 1.4;
      letter-spacing: 0.01em;
      margin-bottom: 1rem;
    }

    h2 {
      font-size: 1.5rem;
      font-weight: 900;
      line-height: 1.4;
      letter-spacing: 0.01em;
      margin-bottom: 0.4rem;
    }

    .lead {
      font-size: 1rem;
      line-height: 1.75;
      font-weight: 600;
      margin-bottom: 1rem;
      color: var(--line);
      letter-spacing: -0.01em;
    }

    .pop {
      opacity: 0;
      animation: pop-in 480ms cubic-bezier(.28, 1.35, .4, 1) forwards;
    }

    .slide {
      opacity: 0;
      animation: slide-in 340ms cubic-bezier(.28, 1.35, .4, 1) forwards;
    }

    @keyframes pop-in {
      from {
        opacity: 0;
        transform: translateY(14px) scale(.94);
      }

      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    @keyframes slide-in {
      from {
        opacity: 0;
        transform: translateX(28px);
      }

      to {
        opacity: 1;
        transform: translateX(0);
      }
    }

    .no-border {
      border: none;
      box-shadow: none;
      padding-right: 0;
      padding-left: 0;
    }

    /* ---- hero ---- */
    .hero {
      text-align: center;
      padding: 1rem 0 0;
    }

    .hero .logo {
      width: 5.5rem;
      margin-bottom: 1rem;
    }

    .hero .brandname {
      font-family: 'Archivo Black', sans-serif;
      font-size: 0.9rem;
      font-weight: 400;
      letter-spacing: 0.1em;
      margin-bottom: 0.6rem;
    }

    .hero h1 {
      font-size: 1.7rem;
      font-weight: 900;
      line-height: 1.45;
      letter-spacing: 0.01em;
    }

    .hero h1 .hl {
      background: linear-gradient(transparent 58%, var(--mustard) 58%);
    }

    .pilot-tag {
      display: inline-block;
      font-size: 0.68rem;
      font-weight: 700;
      color: var(--sub);
      border: 2px dashed var(--line);
      border-radius: 999px;
      padding: 0.4rem 0.8rem;
      margin-top: 0.4rem;
    }

    /* ---- stage cards ---- */
    .stage-active {
      background: var(--white);
    }

    .stage-locked {
      background: var(--cream);
    }

    .stage-locked,
    .stage-locked .eyebrow {
      border-color: var(--brown);
      color: var(--brown);
      box-shadow: 3px 3px 0 var(--brown);
      background-color: var(--cream);
    }

    .stage-locked .lead {
      color: var(--brown);
    }

    .mode-hint {
      font-size: 0.9rem;
      color: var(--sub);
      font-weight: 700;
      margin-top: 0.9rem;
      margin-bottom: 0.2rem;
    }

    /* ---- topbar ---- */
    .topbar {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      padding: 1.2rem 0 0.6rem;
      flex-wrap: wrap;
    }

    .back-btn {
      display: inline-flex;
      align-items: center;
      gap: 0.3rem;
      border: var(--border-s);
      background: var(--white);
      border-radius: 999px;
      padding: 0.45rem 0.85rem;
      font-size: 0.78rem;
      font-weight: 900;
      cursor: pointer;
      font-family: 'Zen Kaku Gothic New';
      color: var(--line);
      box-shadow: var(--box-shadow);
    }

    .back-btn:active {
      transform: translate(1px, 1px);
      box-shadow: 1px 1px 0 var(--line);
    }

    .crumb {
      font-size: 0.72rem;
      color: var(--sub);
      font-weight: 700;
    }

    /* ---- list rows ---- */
    .list-col {
      display: flex;
      flex-direction: column;
      gap: 0.8rem;
      margin-top: 0.8rem;
    }

    .list-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.7rem;
      width: 100%;
      text-align: left;
      background: var(--mustard);
      border: var(--border-s);
      border-radius: 999px;
      padding: 1.1rem 1.3rem;
      font-weight: 700;
      font-size: 1rem;
      cursor: pointer;
      color: var(--line);
      text-decoration: none;
      font-family: 'Zen Kaku Gothic New';
      box-shadow: 3px 3px 0 var(--line);
      transition: transform 120ms ease, box-shadow 120ms ease;
    }

    .list-row:active {
      transform: translate(3px, 3px);
      box-shadow: 0 0 0 var(--line);
    }

    .list-row .arrow {
      font-weight: 900;
      color: var(--line);
      flex: none;
    }

    .list-row .row-title {
      line-height: 1.55;
    }

    /* ---- ep card ---- */
    .ep-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1rem;
      background: var(--mustard);
      border: var(--border);
      border-radius: 20px;
      padding: 1.2rem;
      box-shadow: var(--box-shadow);
      margin-bottom: 1rem;
      text-align: left;
    }

    .ep-card:nth-child(4n + 2) {
      background: var(--blue);
    }

    .ep-card:nth-child(4n + 2) .eyebrow {
      background: var(--green);
    }

    .ep-card:nth-child(4n + 3) {
      background: var(--green);
    }

    .ep-card:nth-child(4n + 3) .eyebrow {
      background: var(--pink);
    }

    .ep-card:nth-child(4n) {
      background: var(--pink);
    }

    .ep-card:nth-child(4n) .eyebrow {
      background: var(--mustard);
    }

    .ep-card-title {
      font-size: 1.2rem;
      font-weight: 800;
      line-height: 1.6;
      letter-spacing: -0.02em;
      color: var(--line);
    }

    .ep-link-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      width: 100%;
      background: var(--line);
      color: var(--white);
      text-decoration: none;
      padding: 1rem 1.4rem;
      border-radius: 999px;
      font-weight: 700;
      letter-spacing: 0.1em;
      font-size: 1rem;
      box-shadow: 2px 2px 0 var(--sub);
      transition: transform 120ms ease;
    }

    .ep-link-btn:active {
      transform: translate(2px, 2px);
      box-shadow: none;
    }

    /* ---- 詳細ページの長文解説スタイル ---- */
    .detail-article-card {
      background: var(--white);
      border: var(--border);
      border-radius: 20px;
      padding: 1.4rem 1.2rem;
      box-shadow: var(--box-shadow);
      margin-bottom: 1.2rem;
      text-align: left;
    }

    .detail-article-body p {
      font-size: 1rem;
      line-height: 1.75;
      font-weight: 600;
      color: var(--sub);
      margin-bottom: 1rem;
      letter-spacing: -0.01em;
    }

    .detail-article-body p:last-child {
      margin-bottom: 0;
    }

    /* ---- footer ---- */
    .footer {
      text-align: center;
      padding: 2rem 1rem;
      margin-top: auto;
    }

    .footer .logo {
      width: 8rem;
    }

    .footer p {
      font-size: 0.72rem;
      font-weight: 500;
      letter-spacing: 0.04em;
      color: var(--sub);
    }

    /* ---- collection grid ---- */
    .badge-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 0.7rem;
      margin-top: 1rem;
    }

    .badge-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.4rem;
      background: var(--mustard);
      border: var(--border-s);
      border-radius: 20px;
      padding: 0.9rem 0.3rem 0.7rem;
      cursor: pointer;
      box-shadow: 3px 3px 0 var(--line);
      transition: transform 120ms ease, box-shadow 120ms ease;
      text-align: center;
    }

    .badge-item:active {
      transform: translate(2px, 2px);
      box-shadow: 1px 1px 0 var(--line);
    }

    .badge-icon {
      width: 2.7rem;
      height: 2.7rem;
      border-radius: 50%;
      border: 2px solid var(--line);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.1rem;
      flex: none;
    }

    .badge-label {
      font-size: 1rem;
      font-weight: 700;
      line-height: 1.2;
      letter-spacing: 0.08em;
    }

    /* ---- 感情タグチップ ---- */
    .tag-list {
      display: flex;
      flex-wrap: wrap;
      gap: 0.3rem;
      width: 100%;
      margin-top: 0.1rem;
    }

    .tag-pill {
      font-size: 0.7rem;
      font-weight: 700;
      color: #555;
      background: var(--cream);
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 0.2rem 0.4rem;
      letter-spacing: -0.04em;
      line-height: 1.2;
      white-space: nowrap;
    }

    .tag-pill-lg {
      font-size: 0.9rem;
      font-weight: 700;
      color: var(--line);
      letter-spacing: 0.04em;
      background: var(--white);
      border: 2px solid var(--line);
      border-radius: 999px;
      padding: 0.5rem 0.75rem;
    }

    .item-icon-big {
      width: 4rem;
      height: 4rem;
      border-radius: 50%;
      border: var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.8rem;
      margin: 0 auto 0.8rem;
      box-shadow: var(--box-shadow);
    }

    .genre-label {
      font-size: 0.8rem;
      font-weight: 700;
      color: var(--line);
      margin-top: 1.5rem;
      margin-bottom: 0.4rem;
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }

    .word-grid {
      grid-template-columns: repeat(3, 1fr);
      gap: 0.6rem;
      margin-top: 0;
    }

    .word-badge {
      padding: 0.8rem 0.6rem;
      border-radius: 10rem;
      justify-content: center;
    }

    /* ---- 常時表示のLINE・Instagram導線 ---- */
    .float-cta {
      position: fixed;
      left: 0;
      bottom: 0;
      display: flex;
      gap: 0.6rem;
      width: 100%;
      padding: 2.4rem 0.8rem 0.8rem;
      flex-wrap: wrap;
      z-index: 100;
      background: linear-gradient(to top, rgba(255, 255, 255, 0.9) 0%, rgba(255, 255, 255, 0) 100%);
    }

    .float-cta p {
      width: 100%;
      margin: 0;
      text-align: center;
      color: var(--line);
      font-weight: 700;
      font-size: 0.8rem;
    }

    .float-btn {
      flex: 1;
      height: 3.8rem;
      border-radius: var(--border-radius);
      border: var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.4rem;
      font-size: 1.1rem;
      letter-spacing: 0.04em;
      font-weight: 700;
      color: var(--white);
      box-shadow: var(--box-shadow);
      text-decoration: none;
      transition: transform 120ms ease;
    }

    .float-btn i {
      font-size: 1.3em;
    }

    .float-btn:active {
      transform: translate(2px, 2px);
      box-shadow: 1px 1px 0 var(--line);
    }

    .float-line {
      background: #06C755;
    }

    .float-ig {
      background: radial-gradient(circle at 30% 107%, #fdf497 0%, #fdf497 5%, #fd5949 45%, #d6249f 60%, #285AEB 90%);
    }
  </style>
</head>

    const IG_ICON = `<svg class="ig" style="fill:#fff; width:1.1em;" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 448 512"><path d="M224.3 141a115 115 0 1 0 -.6 230 115 115 0 1 0 .6-230zm-.6 40.4a74.6 74.6 0 1 1 .6 149.2 74.6 74.6 0 1 1 -.6-149.2zm93.4-45.1a26.8 26.8 0 1 1 53.6 0 26.8 26.8 0 1 1 -53.6 0zm129.7 27.2c-1.7-35.9-9.9-67.7-36.2-93.9-26.2-26.2-58-34.4-93.9-36.2-37-2.1-147.9-2.1-184.9 0-35.8 1.7-67.6 9.9-93.9 36.1s-34.4 58-36.2 93.9c-2.1 37-2.1 147.9 0 184.9 1.7 35.9 9.9 67.7 36.2 93.9s58 34.4 93.9 36.2c37 2.1 147.9 2.1 184.9 0 35.9-1.7 67.7-9.9 93.9-36.2 26.2-26.2 34.4-58 36.2-93.9 2.1-37 2.1-147.8 0-184.8zM399 388c-7.8 19.6-22.9 34.7-42.6 42.6-29.5 11.7-99.5 9-132.1 9s-102.7 2.6-132.1-9c-19.6-7.8-34.7-22.9-42.6-42.6-11.7-29.5-9-99.5-9-132.1s-2.6-102.7 9-132.1c7.8-19.6 22.9-34.7 42.6-42.6 29.5-11.7 99.5-9 132.1-9s102.7-2.6 132.1 9c19.6 7.8 34.7 22.9 42.6 42.6 11.7 29.5 9 99.5 9 132.1s2.7 102.7-9 132.1z"/></svg>`;

    // 全49項目のサブ要素データ（詳細解説文を約2倍〜2.5倍の豊かで深い長文へアップデート）

    const WORD_DESCRIPTIONS = {
      // 没入・安心
      "うっとり": "画面いっぱいに広がる優しい色や柔らかな光を見つめているうちに、日常の悩みや時間の感覚をすっかり忘れ、心が心地よく満たされていく感覚。",

      "ホッとする": "どっしり安定した構図や静かな光に包まれた風景を見て、無意識に力が入っていた肩や身体の緊張が、ふっとほぐれていく感覚。",
      "力がぬける": "境目のないなめらかな影や、優しくかすれた筆の跡を目で追うことで、張っていた気持ちが緩み、身体の力がすーっと抜けていくリラックス感。",

      // 畏敬・圧倒

      // 興奮・活力

      "血が騒ぐ": "画家の全身の運動がそのまま残る激しい筆跡や、押し寄せる群衆の熱気に当てられて、自分の身体の奥から熱いエネルギーが湧き出る感覚。",
      "テンションが上がる": "ポスターのようにくっきりしたコントラストや、ポップで鮮やかな色彩の組み合わせを目にして、脳がダイレクトに刺激される興奮。",
      "そわそわする": "あやしい雲が広がる空や、あえて傾けられたグラグラする構図によって、これから事件が起きそうな予感がして心が落ち着かなくなる感覚。",

      // 違和感・不安
      "ざわざわ": "不気味に光る緑の影や、背中を向けた人物の冷たい沈黙から、「何かおかしいぞ」と不穏な気配を感じ取って胸が落ち着かなくなる感覚。",
      "ヒヤッとする": "すべてを呑み込む真っ黒な闇や、美しい絵の奥に隠されたおそろしい悲劇に気づいた瞬間、背筋にヒヤッと冷たい風が走るような恐怖感。",
      "もやもや": "どこが奥でどこが手前かわからない不思議な空間や、曖昧に溶けた色合いを見て、頭の中で答えが出ず考え込んでしまう感覚。",
      "ソワソワ": "画面全体を隙間なく埋め尽くす模様の繰り返しや、嵐の直前のような空の気配に引っぱられ、胸の奥がざわついて落ち着かない感覚。",
      "落ち着かない": "描かれている物が現実と違って歪んでいたり、激しい原色同士がぶつかり合っていることで、どこに目を置けばいいか迷ってしまう感覚。",
      "こわいのに見たい": "恐ろしい悲劇や崩れかけた廃墟なのに、なぜか息をのむほど美しい。そんな「怖さ」と「美しさ」のギャップに引き寄せられ目が離せない感覚。",

      // 知的快感
      "スッキリ": "数学のように計算されたまっすぐな線や、吸い込まれる一点透視の空間を見ることで、ごちゃごちゃしていた心がスッと整う快感。",
      "なるほど！": "「あ、ここに視線を誘導する仕掛けがあるんだ！」と画家の仕掛けた罠や計算に気づいた瞬間、頭の中のパズルがカチッとはまる快感。",
      "アハ体験": "一見変に見える歪んだポーズや視線の先に隠された意味を発見した瞬間、絵の見え方がガラリと変わって世界が違って見える閃き。",
      "頭がさえる": "ピタッと左右対称に整った構図や、きっちり並ぶ四角形を見ることで、余計な雑念が消え去り、頭の中がクリアに冴えわたる感覚。",
      "つながった感じ": "描かれた人物の手のポーズや重なり合う視線を通して、絵の中のドラマだけでなく、絵を描いた画家や自分自身とも固くつながった感覚。"
    };

    const topbarEl = document.getElementById("topbar");
    const viewEl = document.getElementById("view");

    function goto(state) {
      history.pushState(state, "");
      render(state);
      window.scrollTo(0, 0);
    }
    window.addEventListener("popstate", (e) => {
      render(e.state || { view: "home" });
    });

    function render(state) {
      if (state.view === "emotionList") renderEmotionList();
      else if (state.view === "categoryList") renderCategoryList();
      else if (state.view === "emotion") renderEmotion(state.emotion, state.word);
      else if (state.view === "category") renderCategory(state.cat, state.emotion);
      else if (state.view === "sub") renderSub(state.sub, state.cat, state.emotion);
      else renderHome();
    }

    function renderHome() {
      topbarEl.innerHTML = "";
      let html = `
<section class="hero pop">
<img class="logo" src="assets/logo-black.png" alt="miruha">
<h1 class="display">美術解剖図鑑<br><span class="hl">逆引きインデックス</span></h1>
</section>
`;

      STAGES.forEach((stage, i) => {
        html += `<section class="section center pop ${stage.active ? "stage-active" : "stage-locked"}" style="animation-delay:${i * 60}ms">
<div class="eyebrow">${stage.active ? `<i class=\"fa-solid fa-lock-open\"></i> STAGE ${stage.num}` : `<i class=\"fa-solid fa-lock\"></i> STAGE ${stage.num}`}</div>
<h2>${stage.title}</h2>
<p class="lead" style="font-size:0.9rem;">${stage.goal}</p>
${stage.active ? `
<div class="badge-grid" id="cat-grid"></div>
<p class="mode-hint" style="margin-top:1.3rem">うまく言葉にならないときは</p>
<div class="list-col" id="wordrow-${stage.num}"></div>
` : ""}
</section>`;
      });

      viewEl.innerHTML = html;

      const grid = document.getElementById("cat-grid");
      if (grid) {
        CATEGORIES.forEach(cat => {
          const item = document.createElement("div");
          item.className = "badge-item";
          item.dataset.cat = cat.key;
          item.innerHTML = `<span class="badge-icon" style="background:var(--white)"><i class="fa-solid fa-${cat.icon}"></i></span><span class="badge-label">${cat.name}</span>`;
          item.addEventListener("click", () => goto({ view: "category", cat: cat.key }));
          grid.appendChild(item);
        });
      }

      const row = document.getElementById("wordrow-1");
      if (row) {
        const item = document.createElement("div");
        item.className = "list-row";
        item.innerHTML = `<span class="badge-icon" style="background:var(--white)"><i class="fa-solid fa-heart"></i></span><span class="row-title">気持ち・感覚から探す</span><span class="arrow"><i class="fa-solid fa-arrow-right"></i></span>`;
        item.addEventListener("click", () => goto({ view: "emotionList" }));
        row.appendChild(item);
      }
    }

    function renderEmotionList() {
      topbarEl.innerHTML = `
<button class="back-btn" id="backBtn"><i class="fa-solid fa-arrow-left"></i> TOPに戻る</button>
`;
      document.getElementById("backBtn").addEventListener("click", () => history.back());

      const groups = EMOTIONS.map(em => {
        const badges = em.words.map(w => `<div class="badge-item word-badge" data-em="${em.key}" data-word="${w}"><span class="badge-label">${w}</span></div>`).join("");
        return `
<div class="genre-label">
<i class="fa-solid fa-${em.icon}"></i> ${em.name}</div>
<div class="badge-grid word-grid">${badges}</div>
`;
      }).join("");

      viewEl.innerHTML = `
<section class="section slide" style="background:var(--white)">
<div class="eyebrow"><i class="fa-solid fa-heart"></i> 気持ち・感覚</div>
<h2>作品を前に、どう感じてる？</h2>
<p class="lead">その気持ちや感覚は、どんな視覚のしかけにつながっているのかな？</p>
${groups}
</section>
`;

      viewEl.querySelectorAll("[data-em]").forEach(row => {
        row.addEventListener("click", () => goto({ view: "emotion", emotion: row.dataset.em, word: row.dataset.word }));
      });
    }

    function renderCategoryList() {
      topbarEl.innerHTML = `
<button class="back-btn" id="backBtn"><i class="fa-solid fa-arrow-left"></i> 戻る</button>
<span class="crumb">Stage1 / 視覚のしかけから</span>
`;
      document.getElementById("backBtn").addEventListener("click", () => history.back());

      const rows = CATEGORIES.map(cat => `
<div class="list-row" data-cat="${cat.key}">
<span><i class="fa-solid fa-${cat.icon}"></i></span><span class="row-title" style="flex:1">${cat.name}</span><span class="arrow"><i class="fa-solid fa-arrow-right"></i></span>
</div>
`).join("");

      viewEl.innerHTML = `
<section class="section no-border slide" style="background:var(--mustard)">
<div class="eyebrow"><i class="fa-solid fa-palette"></i> 視覚のしかけから探す</div>
<h2>気になる「しかけ」をえらんでください</h2>
<p class="lead">色・光・筆致など、6つの切り口があります。</p>
<div class="list-col">${rows}</div>
</section>
`;

      viewEl.querySelectorAll("[data-cat]").forEach(row => {
        row.addEventListener("click", () => goto({ view: "category", cat: row.dataset.cat }));
      });
    }

    // 感情・オノマトペからSUBS内のtagsを元に動的にサブ要素を抽出して表示
    function renderEmotion(emKey, word) {
      const em = EMOTIONS.find(e => e.key === emKey);
      const heading = word || em.short;
      const others = em.words.filter(w => w !== heading);

      // 個別オノマトペの説明文を取得（存在しなければ大カテゴリのmechanismにフォールバック）
      const wordDescription = (word && WORD_DESCRIPTIONS[word]) ? WORD_DESCRIPTIONS[word] : em.mechanism;

      // SUBSの各アイテム内の tags から、選択された word (#ドキドキ 等) を含むものをリアルタイムで自動抽出！
      let matchedSubs = word
        ? SUBS.filter(s => s.tags && s.tags.some(t => t.replace('#', '') === word))
        : SUBS.filter(s => em.subs.includes(s.key));

      // 万が一1つもマッチしなかった場合の安全回路
      if (matchedSubs.length === 0) {
        matchedSubs = SUBS.filter(s => em.subs.includes(s.key));
      }

      topbarEl.innerHTML = `
<button class="back-btn" id="backBtn"><i class="fa-solid fa-arrow-left"></i> 気持ち・感覚に戻る</button>
`;
      document.getElementById("backBtn").addEventListener("click", () => history.back());

      const subBadges = matchedSubs.map(s => {
        const cat = CATEGORIES.find(x => x.key === s.cat) || { icon: "star" };
        const inner = s.swatch
          ? `<span class="badge-icon" style="background:${s.swatch}"></span>`
          : `<span class="badge-icon" style="background:var(--white)"><i class="fa-solid fa-${s.icon || cat.icon}"></i></span>`;

        const tagsHtml = s.tags && s.tags.length ? `
<div class="tag-list">
${s.tags.slice(0, 2).map(t => `<span class="tag-pill">${t}</span>`).join("")}
</div>
` : "";

        return `<div class="badge-item" data-sub="${s.key}" data-cat="${s.cat}">
${inner}
<span class="badge-label">${s.name}</span>
</div>`;
      }).join("");

      viewEl.innerHTML = `
<section class="section slide">
<div class="eyebrow"><i class="fa-solid fa-${em.icon}"></i> ${em.name}</div>
<h2>「${heading}」</h2>
<p class="lead" style="margin-top:0.4rem;">${wordDescription}</p>
<p class="mode-hint" style="margin-top:1.5rem; font-size:0.8rem; color:var(--line);"><i class="fa-solid fa-lightbulb"></i> こんな「しかけ」が関係しているかも</p>
<div class="badge-grid">${subBadges}</div>
</section>
`;

      viewEl.querySelectorAll("[data-sub]").forEach(btn => {
        btn.addEventListener("click", () => goto({ view: "sub", sub: btn.dataset.sub, cat: btn.dataset.cat, emotion: emKey }));
      });
    }

    function renderCategory(catKey, emotionKey) {
      const cat = CATEGORIES.find(c => c.key === catKey);
      const subs = SUBS.filter(s => s.cat === catKey);
      const em = EMOTIONS.find(e => e.key === emotionKey);
      const gotCount = subs.filter(s => s.episodes && s.episodes.length).length;

      topbarEl.innerHTML = `
<button class="back-btn" id="backBtn"><i class="fa-solid fa-arrow-left"></i> TOPに戻る</button>`;
      document.getElementById("backBtn").addEventListener("click", () => history.back());

      const badges = subs.map(s => {
        const inner = s.swatch
          ? `<span class="badge-icon" style="background:${s.swatch}"></span>`
          : `<span class="badge-icon" style="background:var(--white)"><i class="fa-solid fa-${s.icon || cat.icon}"></i></span>`;

        const tagsHtml = s.tags && s.tags.length ? `
<div class="tag-list">
${s.tags.slice(0, 2).map(t => `<span class="tag-pill">${t}</span>`).join("")}
</div>
` : "";

        return `<div class="badge-item" data-sub="${s.key}">
${inner}
<span class="badge-label">${s.name}</span>
</div>`;
      }).join("");

      viewEl.innerHTML = `
<section class="section slide">
<div class="eyebrow"><i class="fa-solid fa-${cat.icon}"></i> ${cat.name}</div>
<h2>${cat.name}のしかけ</h2>
<p class="lead">${cat.meaning}</p>
<p class="mode-hint" style="margin-top:1.5rem; font-size:0.8rem; color:var(--line);"><i class="fa-solid fa-lightbulb"></i> 例えば、こんな「${cat.name}のしかけ」があるよ</p>
<div class="badge-grid">${badges}</div>
</section>
`;

      viewEl.querySelectorAll("[data-sub]").forEach(item => {
        item.addEventListener("click", () => goto({ view: "sub", sub: item.dataset.sub, cat: catKey, emotion: emotionKey }));
      });
    }

    function renderSub(subKey, catKey, emotionKey) {
      const s = SUBS.find(x => x.key === subKey) || { name: subKey, meaning: "", episodes: [], tags: [] };
      const cat = CATEGORIES.find(c => c.key === (s.cat || catKey)) || { name: "", icon: "star" };

      topbarEl.innerHTML = `
<button class="back-btn" id="backBtn"><i class="fa-solid fa-arrow-left"></i> ${cat.name}に戻る</button>`;
      document.getElementById("backBtn").addEventListener("click", () => history.back());

      const bigIcon = s.swatch
        ? `<span class="item-icon-big" style="background:${s.swatch}"></span>`
        : `<span class="item-icon-big" style="background:var(--pink)"><i class="fa-solid fa-${s.icon || cat.icon}"></i></span>`;

      const tagsDetailHtml = s.tags && s.tags.length ? `
<div class="tag-list" style="margin-top:0.6rem; margin-bottom:3rem;">
${s.tags.map(t => `<span class="tag-pill tag-pill-lg">${t}</span>`).join("")}
</div>
` : "";

      // 改行(\n\n)を美しい段落(<p>)に自動整形
      const formattedMeaning = s.meaning
        ? s.meaning.split(/\n\n+/).map(p => `<p>${p.replace(/\n/g, '<br>')}</p>`).join('')
        : `<p>${s.meaning}</p>`;

      const formattedSummary = s.summary
        ? s.summary.split(/\n\n+/).map(p => `${p.replace(/\n/g, '<br>')}`).join('')
        : `${s.summary}`;

      const hasEps = s.episodes && s.episodes.length;
      const eps = hasEps ? s.episodes.map(ep => {
        const volBadge = ep.vol ? `<span class="eyebrow">${ep.vol}</span>` : '';
        const artistsHtml = ep.artists && ep.artists.length ? `
<div class="tag-list">
${ep.artists.map(a => `<span class="tag-pill">${a}</span>`).join('')}
</div>
` : '';

        return `
<div class="ep-card">
<div class="ep-card-top">
${volBadge}
<div class="ep-card-title">${ep.title}</div>
</div>
${artistsHtml}
<a class="ep-link-btn" href="${ep.url || '#'}" target="_blank" rel="noopener">
<span>Instagramで読む</span>
<i class="fa-solid fa-up-right-from-square"></i>
</a>
</div>
`;
      }).join("") : ``;

      viewEl.innerHTML = `
<section class="section no-border slide" style="background:var(--cream);padding-bottom:0;">
<div style="text-align:center;">
${bigIcon}
<h1>${s.name}</h1>
${formattedSummary ? `<div class="lead">${formattedSummary}</div>` : ''}
<div class="detail-article-card">
<div class="detail-article-body">
${formattedMeaning}
</div>
</div>
${tagsDetailHtml}
</div>
${hasEps ? `<div class="mode-hint" style="margin:1.5rem 0 0.5rem; text-align:left;">「${s.name}」をテーマにした漫画はこちら</div><div class="list-col">${eps}</div>` : eps}
</section>
`;
    }

    async function bootWithLiff() {
      // LINEの中かどうか・友だち状態に関わらず、中身は常に見られるようにする。
      // LIFFはエラーが出ても無視して、そのままアプリを表示する。
      history.replaceState({ view: "home" }, "");
      renderHome();

      if (LIFF_ID && LIFF_ID !== "YOUR_LIFF_ID_HERE") {
        try {
          await liff.init({ liffId: LIFF_ID });
          // LINEアプリの中で開いている場合は、もう追加できているはずなので
          // LINEの導線ボタンだけ非表示にする（Instagramは常に表示のまま）
          if (liff.isInClient()) {
            const lineBtn = document.getElementById("floatLineBtn");
            if (lineBtn) lineBtn.style.display = "none";
          }
        } catch (e) {
          console.warn("[miruha] LIFF init failed (ignored):", e);
        }
      }
    }

    bootWithLiff();
  </script>

</body>

</html>
